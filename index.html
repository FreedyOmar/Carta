<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Carta</title>
</head>
<body>
   <!-- <h1>titulo </h1> -->

    <div class="contenedor">
        <div class="envoltura-sobre">
            <div class="sobre">
                <div class="carta">
                    <div class="contenido" id="dedicacion">
                        <!-- Aquí se insertará el texto dinámicamente -->
                    </div>
                </div>
            </div>
            <div class="corazon"></div>
            <div class="solapa-derecha"></div>
            <div class="solapa-izquierda"></div>
        </div>
    </div>

    <script>
        // Función para obtener el parámetro 'text' de la URL
        function getURLParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        // Mostrar texto dinámico o predeterminado
        function showDedicationText() {
            let text = getURLParam('text');
            if (!text) {
                text = `Quiero disculparme contigo...
Creo que ya lo habia mencionado pero verdad no soy muy bueno hablando,
                
creeme quisiera poder decirte tantas cosas lindas que pienso de ti, pero te veo y el corazon se me acelera,Aun con mi forma torpe de comunicarme, quiero que sepas que me encantas. Me gusta tu manera de ser, lo que transmites, y cómo haces que incluso mis días más simples se sientan un poco más especiales.

Tal vez no soy el mejor hablando, pero lo que siento por ti es real. Y si te lo digo ahora, es porque ya no quiero quedarme callado. Me gustaría conocerte más, compartir más momentos y, si tú también lo sientes, dar un paso hacia algo más bonito entre los dos.

No espero una respuesta perfecta, solo quería ser honesto… por primera vez sin miedo. `;
            } else {
                text = decodeURIComponent(text).replace(/\\n/g, '\n');
            }

            // Mostrar el texto en el div
            const contenedor = document.getElementById('dedicacion');
            contenedor.innerText = text;
        }

        // Ejecutar cuando cargue la página
        window.onload = showDedicationText;
       
    </script>
     <script src="script._v1.js"></script>
</body>
</html>
