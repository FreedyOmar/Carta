<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Carta</title>

    <style>
        .zona-video{
            width:100%;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            margin-top:20px;
        }

        .btn-video{
            background: linear-gradient(45deg,#ff4b7d,#ff758c);
            border:none;
            padding:12px 25px;
            color:white;
            font-size:18px;
            border-radius:25px;
            cursor:pointer;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
            transition:0.3s;
        }

        .btn-video:hover{
            transform:scale(1.05);
        }

        .video-oculto{
            display:none;
            margin-top:15px;
            width:100%;
            border-radius:15px;
            overflow:hidden;
        }
    </style>
</head>

<body>
    <h1>¡Un detalle para la mejor amiga❤️</h1>

    <div class="contenedor">
        <div class="envoltura-sobre">
            <div class="sobre">
                <div class="carta">

                    <div class="contenido" id="dedicacion">
                        <!-- Texto dinámico -->
                    </div>

                    <!-- BOTÓN Y VIDEO DENTRO DE LA CARTA -->
                    <div class="zona-video">
                        <button id="btnVideo" class="btn-video">🎬 Ver video</button>

                        <div id="contenedorVideo" class="video-oculto">
                            <video controls width="100%">
                                <source src="/02.mp4" type="video/mp4">
                                Tu navegador no soporta video.
                            </video>
                        </div>
                    </div>

                </div>
            </div>

            <div class="corazon"></div>
            <div class="solapa-derecha"></div>
            <div class="solapa-izquierda"></div>
        </div>
    </div>

    <!-- TEXTO DINÁMICO -->
    <script>
        function getURLParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        function showDedicationText() {
            let text = getURLParam('text');
            if (!text) {
                text = `No soy de celebrar este dia..
Pero quiero aprovechar la fecha para agradecerte.  

Por tu amistad, por estar ahi para mi, cuando mas lo necesite.

Por perdonar mi inmadurez y por acompañarme en este camino hacia la madurez.

Eres una exelente persona, y si tal vez no eres perfecta, por que nadie lo es, pero aun asi con errores o fallas sigues adelante y
admiro eso de ti.

No existen palabras para describir la alegria que siento de saber que eres mi amiga, y de que aun sabiendo que soy un "moustro"
me siges brindado apoyo, eres de lo mejor que me pudo haber pasado en la vida.

No encuentro otra forma de cerra esto mas que diciendo lo de siempre, si pudiera tener 5 vidas se que en cada una de ellas todo seria difente, Pero en cada una de ellas tambien me 
encontraria contigo y terminaria guardando una parte de ti en mi.

Gracias Katy por ser mi amiga.✨✨✨
`;
            } else {
                text = decodeURIComponent(text).replace(/\\n/g, '\n');
            }

            document.getElementById('dedicacion').innerText = text;
        }

        window.onload = showDedicationText;
    </script>

    <!-- SCRIPT BOTÓN VIDEO CORREGIDO -->
    <script>
        const btnVideo = document.getElementById("btnVideo");
        const contenedorVideo = document.getElementById("contenedorVideo");

        btnVideo.addEventListener("click", function(e){
            e.stopPropagation(); // 🚀 evita que cierre la carta
            contenedorVideo.style.display = "block";
            this.style.display = "none";
        });

        contenedorVideo.addEventListener("click", function(e){
            e.stopPropagation(); // 🚀 evita que el video cierre la carta
        });
    </script>

    <!-- TU SCRIPT PRINCIPAL -->
    <script src="script._v1.js"></script>

</body>
</html>
